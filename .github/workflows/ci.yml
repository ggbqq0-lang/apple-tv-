name: Android and protocol checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mac_probe/requirements.lock.txt
      - name: Install Android SDK components
        run: |
          sdk_managers=("$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager)
          "${sdk_managers[0]}" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install test dependencies
        run: python -m pip install -r mac_probe/requirements.lock.txt
      - name: Protocol and Python tests with independent loopback fake
        run: python -m mac_probe.run_checks
      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease lintDebug lintRelease --console=plain
